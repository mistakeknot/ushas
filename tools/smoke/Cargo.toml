[package]
name = "ushas-smoke"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
publish = false

[workspace]

[dependencies]
ushas-claude-model = { path = "../claude-model" }
bevy_metalfx = { path = "../..", features = ["frame-interpolation", "diagnostic-fault-injection"] }
bevy = { version = "0.19", default-features = false, features = [
    "bevy_asset", "bevy_color", "bevy_core_pipeline", "bevy_log",
    "bevy_pbr", "bevy_render", "bevy_window", "bevy_winit",
    "bevy_ui", "bevy_ui_render", "bevy_text", "default_font",
    "multi_threaded", "png", "x11",
] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSNotification", "NSObject", "NSString", "NSOperation", "block2"] }
