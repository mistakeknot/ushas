[package]
name = "ushas-bench"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
publish = false

[workspace]

[dependencies]
ushas-claude-model = { path = "../claude-model" }
bevy_metalfx = { path = "../..", default-features = false, features = ["temporal"] }
bevy = { version = "=0.19.0", default-features = false, features = [
    "bevy_asset", "bevy_color", "bevy_core_pipeline", "bevy_log",
    "bevy_pbr", "bevy_render", "bevy_window", "bevy_winit",
    "bevy_ui", "bevy_ui_render", "bevy_text", "default_font",
    "multi_threaded", "png", "x11", "tonemapping_luts", "zstd_rust",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
png = "0.18"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSProcessInfo"] }
