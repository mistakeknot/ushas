[package]
name = "bevy_metalfx"
version = "0.3.0"
edition = "2021"
authors = ["mk <mk@generalsystemsventures.com>"]
description = "Bevy plugin for Apple MetalFX upscaling and frame interpolation"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mistakeknot/bevy_metalfx"
keywords = ["bevy", "metalfx", "upscaling", "apple", "metal"]
categories = ["game-engines", "rendering", "graphics"]
rust-version = "1.82"
readme = "README.md"
# examples/present_repro.rs is a bug-reproduction harness for an internal
# issue, referencing scripts that live outside this crate; scripts/ verifies a
# *published* build and cannot run from inside one. Both stay in the repo and
# out of the package.
exclude = ["examples/", "scripts/"]

# docs.rs must build on x86_64-unknown-linux-gnu, where this crate is almost
# entirely #[cfg]'d out, so the rendered docs show the non-macOS stub rather
# than the real API. That is not fixable from here.
#
# 0.2.0 tried `default-target = "aarch64-apple-darwin"` and the build FAILED:
# docs.rs cross-compiles from a Linux container and still has to compile the
# dependency graph, and `blake3` (pulled in by bevy_asset, so unavoidable for
# any bevy crate) has a cc-rs build script. Targeting Apple makes it pass
# `-arch arm64 -mmacosx-version-min=11.0` to Linux gcc, which rejects them.
# A failed build means no docs page at all — strictly worse than the stub.
#
# So: build where it can build. `all-features` still helps, and the real API
# docs are verified on a macOS runner by .github/workflows/bevy-metalfx.yml.
[package.metadata.docs.rs]
all-features = true

[features]
default = ["spatial"]
spatial = []
temporal = ["spatial", "objc2-metal-fx/MTLFXTemporalScaler"]
frame-interpolation = ["temporal", "objc2-metal-fx/MTLFXFrameInterpolator"]

[dependencies]
bevy = { version = "0.18", default-features = false, features = [
  "bevy_camera",
  "bevy_render",
  "bevy_core_pipeline",
  "bevy_window",
] }
log = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
# wgpu + wgpu-hal for raw Metal device/texture/cmdbuf extraction via as_hal
wgpu = "27"
wgpu-hal = { version = "27", features = ["metal"] }
# foreign-types for metal crate's ForeignType::as_ptr()
foreign-types = "0.5"
# Matches bevy_window's, so `RawWindowHandle` unifies with Bevy's handle type.
raw-window-handle = "0.6"
objc2 = "0.6"
# block2 for MTLCommandBuffer addCompletedHandler: GPU-timing closure (Phase 0 bench)
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSObject"] }
objc2-metal = { version = "0.3", features = [
  "MTLDevice",
  "MTLTexture",
  "MTLCommandBuffer",
  "MTLPixelFormat",
  # Dual presentation: typed presentDrawable:/atTime: and addPresentedHandler:.
  # Hand-rolled msg_send for these is easy to get subtly wrong at the block ABI.
  "MTLDrawable",
  "block2",
  "objc2-core-foundation",
] }
# `default-features = false` is load-bearing: objc2-metal-fx's default feature
# enables every binding it ships, including four MTL4FX* families this crate
# never touches, which would make the per-feature gating below a no-op.
# Only the spatial bindings are unconditional; `temporal` and
# `frame-interpolation` add theirs through this crate's own features, so
# `--no-default-features --features spatial` really does compile less.
objc2-metal-fx = { version = "0.3", default-features = false, features = [
  "MTLFXSpatialScaler",
] }
